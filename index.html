<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>火鍋の店</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #2b211f;
        color: #3d2924;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }

      /* ===== KHUNG GAME: đúng tỉ lệ ảnh nền (768 x 1376) ===== */
      .game {
        width: min(100%, 920px, calc(100dvh * 768 / 1376));
        aspect-ratio: 768 / 1376; /* đổi số này nếu ảnh của bạn có kích thước khác */
        margin: auto;
        position: relative;
        overflow: hidden;
        container-type: inline-size; /* để dùng đơn vị cqw */
        background: #d9a681 url("img/bg2.jpg") center / 100% 100% no-repeat;
      }
      .game > * {
        position: absolute;
        z-index: 1;
      }
      .scene,
      .counter,
      .kitchen {
        inset: 0;
        pointer-events: none;
      }
      .scene > *,
      .counter > *,
      .kitchen > *,
      .kitchen-inner > * {
        pointer-events: auto;
      }
      .scene > *,
      .counter > *,
      .kitchen > *,
      .kitchen-inner > * {
        position: absolute;
      }

      /* ===== BẢNG ĐẦU NGÀY ===== */
      .intro-day {
        font-size: clamp(28px, 5vw, 44px) !important;
      }
      .intro-money {
        width: 100%;
        padding: 14px 10px;
        text-align: center;
        font-weight: 900;
        line-height: 1.5;
        background: #fbeed6;
        border: 3px solid #d8b58d;
        border-radius: 16px;
      }
      .intro-money small {
        display: block;
        font-size: 14px;
        font-weight: 800;
        opacity: 0.8;
      }
      .intro-money b {
        font-size: clamp(24px, 4vw, 34px);
        color: #9b1f2a;
      }

      /* ===== TOP BAR ===== */
      .top {
        top: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto auto;
        gap: 1cqw;
        padding: 1.2cqw;
        background: rgba(78, 48, 43, 0.72);
      }
      .stat {
        min-height: 6cqw;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
        background: #71483e;
        border: 3px solid #a36f60;
        border-radius: 1.6cqw;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.15);
        font-weight: 800;
        font-size: max(11px, 2.1cqw);
      }

      /* ===== KHÁCH + BUBBLE ===== */
      .window {
        display: none;
      }

      .customer {
        left: 44.4%;
        top: 37%;
        width: 11cqw;
        margin: 0;
        text-align: center;
      }
      .head {
        width: 7.8cqw;
        height: 7.8cqw;
        margin: auto;
        border: max(2px, 0.4cqw) solid #56352e;
        border-radius: 50%;
        background: #f5c6a7;
        position: relative;
      }
      .head:before,
      .head:after {
        content: "";
        position: absolute;
        top: 3.3cqw;
        width: 0.8cqw;
        height: 1cqw;
        border-radius: 50%;
        background: #392724;
      }
      .head:before {
        left: 2.1cqw;
      }
      .head:after {
        right: 2.1cqw;
      }
      .head span {
        position: absolute;
        left: 50%;
        bottom: 1.7cqw;
        width: 2cqw;
        height: 0.8cqw;
        transform: translateX(-50%);
        border-bottom: max(2px, 0.3cqw) solid #6d3d39;
        border-radius: 50%;
      }
      .body {
        width: 9.2cqw;
        height: 6cqw;
        margin: -0.4cqw auto 0;
        background: #f0ece4;
        border: max(2px, 0.4cqw) solid #56352e;
        border-radius: 5cqw 5cqw 1.5cqw 1.5cqw;
      }

      .bubble {
        left: 57%;
        top: 31.5%;
        width: 28%;
        margin: 0;
        padding: 0.45cqw 0.8cqw;
        background: #fffaf2;
        border: 3px solid #704538;
        border-radius: 2.2cqw;
        text-align: center;
        font-size: max(10px, 1.55cqw);
        line-height: 1.2;
        font-weight: 800;
        box-shadow: 0 4px 0 rgba(70, 40, 30, 0.15);
      }
      .bubble:after {
        content: "";
        position: absolute;
        left: -1cqw;
        top: 50%;
        margin-top: -0.9cqw;
        width: 1.8cqw;
        height: 1.8cqw;
        background: #fffaf2;
        border-left: 3px solid #704538;
        border-bottom: 3px solid #704538;
        transform: rotate(45deg);
      }
      .order {
        margin-top: 0.2cqw;
        font-size: max(9px, 1.25cqw);
        line-height: 1.15;
        color: #6d4538;
      }

      /* ===== QUẦY NGUYÊN LIỆU ===== */
      .counter {
        padding: 0;
        background: none;
        border: 0;
      }
      .counter > div[style] {
        display: none;
      }

      .section-title {
        margin: 0;
        padding: 0.4cqw 1cqw;
        color: #fff;
        background: #80513f;
        border: 2px solid #9d6c59;
        border-radius: 1cqw;
        font-weight: 900;
        letter-spacing: 0.5px;
        font-size: max(10px, 1.7cqw);
        z-index: 3;
      }
      .section-title:first-child {
        left: 4%;
        top: 41.5%;
      } /* nhãn "Nước lẩu" phía trên 4 nước dùng trên mặt quầy */
      .section-title:nth-child(4) {
        display: none;
      }
      #broths,
      #ingredients {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      #broths .ingredient,
      #ingredients .ingredient {
        position: absolute;
        pointer-events: auto;
      }
      /* 4 nước lẩu đặt trên 4 mặt bếp từ */
      #broths .ingredient:nth-child(1) {
        left: 6.51%;
        top: 44.48%;
      }
      #broths .ingredient:nth-child(2) {
        left: 27.99%;
        top: 44.48%;
      }
      #broths .ingredient:nth-child(3) {
        left: 50.78%;
        top: 44.48%;
      }
      #broths .ingredient:nth-child(4) {
        left: 72.27%;
        top: 44.48%;
      }
      #broths .ingredient {
        width: 20.83%;
        height: 11.63%;
      }
      /* 10 nguyên liệu đặt vào 10 khay inox (2 hàng x 5) */
      #ingredients .ingredient:nth-child(1) {
        left: 7.03%;
        top: 57.41%;
      }
      #ingredients .ingredient:nth-child(2) {
        left: 23.44%;
        top: 57.41%;
      }
      #ingredients .ingredient:nth-child(3) {
        left: 40.23%;
        top: 57.41%;
      }
      #ingredients .ingredient:nth-child(4) {
        left: 56.77%;
        top: 57.41%;
      }
      #ingredients .ingredient:nth-child(5) {
        left: 73.44%;
        top: 57.41%;
      }
      #ingredients .ingredient:nth-child(6) {
        left: 5.99%;
        top: 66.13%;
      }
      #ingredients .ingredient:nth-child(7) {
        left: 22.92%;
        top: 66.13%;
      }
      #ingredients .ingredient:nth-child(8) {
        left: 40.36%;
        top: 66.13%;
      }
      #ingredients .ingredient:nth-child(9) {
        left: 57.68%;
        top: 66.13%;
      }
      #ingredients .ingredient:nth-child(10) {
        left: 75.39%;
        top: 66.13%;
      }
      #ingredients .ingredient {
        width: 17.19%;
        height: 6.54%;
      }
      .cards {
        display: grid;
        gap: 0;
        align-items: center;
      }

      .ingredient {
        height: 100%;
        min-height: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2cqw;
        color: #fff3df;
        background: transparent;
        border: 0;
        border-radius: 1.2cqw;
        font-weight: 800;
        transition:
          transform 0.12s,
          background 0.12s,
          box-shadow 0.12s;
      }
      .ingredient:hover {
        transform: translateY(-2px);
      }
      .ingredient.selected {
        background: rgba(255, 220, 150, 0.25);
        box-shadow:
          0 0 0 3px #ffd17d,
          0 0 14px rgba(255, 209, 125, 0.7);
        transform: translateY(-2px);
      }
      .cards .food-image {
        width: 10.6cqw;
        height: 10.6cqw;
        margin: 0;
        object-fit: contain;
        display: block;
      }
      .cards .food-fallback {
        width: 10.6cqw;
        height: 10.6cqw;
        line-height: 10.6cqw;
        font-size: 6.4cqw;
        margin: 0;
        text-align: center;
      }
      #ingredients .name {
        position: relative;
        z-index: 1;
        margin-top: -1.6cqw;
      }
      #broths .food-image {
        width: 19cqw;
        height: 19cqw;
      }
      #broths .food-fallback {
        width: 19cqw;
        height: 19cqw;
        line-height: 19cqw;
        font-size: 11cqw;
      }
      .name {
        font-size: max(9px, 1.7cqw);
        color: #fff3df;
        text-shadow: 0 1px 2px rgba(40, 20, 15, 0.95);
      }

      /* ===== BẾP ===== */
      .kitchen {
        padding: 0;
        background: none;
      }
      .kitchen-inner {
        display: contents;
      }

      /* Nồi vẽ tay không còn cần: ảnh nền đã có nồi + bếp */
      .pot {
        display: none;
      }

      /* ===== TÔ NƯỚC LÈO TRÊN BẾP ===== */
      .stove-pot {
        left: 53.1%; /* giữa mâm gỗ phía dưới (x ~408 / 768) */
        top: 71%;
        width: 27cqw;
        height: 17.5cqw;
        display: none;
        pointer-events: none !important;
        z-index: 4;
      }
      .stove-pot,
      .stove-pot * {
        pointer-events: none !important;
      }
      .stove-pot.show {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        animation: potIn 0.35s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      .stove-pot img,
      .stove-pot .food-fallback {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0.5cqw 0.4cqw rgba(30, 15, 10, 0.5));
      }
      .stove-pot .food-fallback {
        line-height: 17.5cqw;
        font-size: 13cqw;
        text-align: center;
      }
      /* Nguyên liệu đã chọn sẽ hiện bên trong tô, chồng lên hình nước lẩu */
      .pot-ingredients {
        position: absolute;
        left: 17%;
        top: 24%;
        width: 66%;
        height: 48%;
        z-index: 3;
        pointer-events: none;
      }
      .pot-ingredients img {
        position: absolute;
        width: 29%;
        height: 58%;
        object-fit: contain;
        filter: drop-shadow(0 0.18cqw 0.15cqw rgba(30, 15, 10, 0.35));
        animation: ingredientPop 0.18s ease-out;
      }
      @keyframes ingredientPop {
        from {
          transform: scale(0.55);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .stove-pot .steam {
        position: absolute;
        bottom: 70%;
        width: 1.2cqw;
        height: 4cqw;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        filter: blur(0.5cqw);
        opacity: 0;
        animation: steam 2s ease-out infinite;
      }
      .stove-pot .steam:nth-of-type(1) {
        left: 32%;
      }
      .stove-pot .steam:nth-of-type(2) {
        left: 48%;
        animation-delay: 0.6s;
      }
      .stove-pot .steam:nth-of-type(3) {
        left: 64%;
        animation-delay: 1.2s;
      }
      @keyframes steam {
        0% {
          opacity: 0;
          transform: translateY(0) scaleX(1);
        }
        30% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
          transform: translateY(-5cqw) scaleX(2);
        }
      }
      @keyframes potIn {
        0% {
          transform: translate(-50%, 0) scale(0.3);
          opacity: 0;
        }
        100% {
          transform: translate(-50%, 0) scale(1);
          opacity: 1;
        }
      }
      .stove-pot {
        transform: translateX(-50%);
      }

      .heatbox {
        left: 6.5%;
        top: 70.8%;
        width: 24.5cqw;
        padding: 1cqw;
        color: #4c3029;
        background: #ead7c3;
        border-radius: 1.3cqw;
        border: 3px solid #70483c;
      }
      .heat-title {
        font-weight: 900;
        margin-bottom: 0.4cqw;
        font-size: max(10px, 1.7cqw);
      }
      input[type="range"] {
        width: 100%;
        margin: 0;
      }
      .heat-text {
        text-align: center;
        font-size: max(9px, 1.5cqw);
        font-weight: 800;
      }

      .serve {
        left: 50%;
        top: 96.4%;
        transform: translate(-50%, -50%);
        width: 30cqw;
        min-height: 6.5cqw;
        padding: 1cqw;
        color: #59352a;
        background: #ffd17d;
        border: 3px solid #704538;
        border-radius: 1.4cqw;
        font-size: max(12px, 2.2cqw);
        font-weight: 900;
        box-shadow: 0 4px 0 #422c26;
      }
      .serve:active {
        transform: translate(-50%, calc(-50% + 2px));
        box-shadow: 0 2px 0 #422c26;
      }
      .serve:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .message {
        left: 50%;
        top: 85%;
        transform: translateX(-50%);
        width: 70%;
        min-height: 0;
        margin: 0;
        padding: 0.8cqw 1.2cqw;
        color: #fff;
        text-align: center;
        font-weight: 800;
        font-size: max(11px, 2cqw);
        background: rgba(78, 48, 43, 0.8);
        border-radius: 1.2cqw;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }

      /* ===== NÚT DỪNG ===== */
      .game.paused * {
        animation-play-state: paused !important;
      }
      #pauseModal .btn-play {
        width: 100%;
      }

      /* ===== LÀM ĐẸP NÚT TRONG GAME ===== */
      /* Nút dừng: tròn, cùng phong cách nút kem của menu */
      .pause-btn {
        width: 6cqw;
        height: 6cqw;
        min-height: 0;
        padding: 0;
        align-self: center;
        color: transparent;
        background:
          linear-gradient(#5a3a2e, #5a3a2e) 36% 50% / 11% 40% no-repeat,
          linear-gradient(#5a3a2e, #5a3a2e) 64% 50% / 11% 40% no-repeat,
          linear-gradient(#fbeed6, #efd7b0);
        border: 3px solid #b98a62;
        border-radius: 50%;
        box-shadow: 0 0.5cqw 0 #a07650;
        transition:
          transform 0.12s,
          filter 0.12s;
      }
      .pause-btn:hover {
        filter: brightness(1.07);
        transform: translateY(-1px);
      }
      .pause-btn:active {
        transform: translateY(0.3cqw);
        box-shadow: 0 0.15cqw 0 #a07650;
      }

      /* Nút cài đặt (bánh răng) cạnh nút dừng */
      .gear-btn {
        width: 6cqw;
        height: 6cqw;
        min-height: 0;
        padding: 0;
        align-self: center;
        line-height: 1;
        font-size: 3.6cqw;
        color: #5a3a2e;
        background: linear-gradient(#fbeed6, #efd7b0);
        border: 3px solid #b98a62;
        border-radius: 50%;
        box-shadow: 0 0.5cqw 0 #a07650;
        transition:
          transform 0.12s,
          filter 0.12s;
      }
      .gear-btn:hover {
        filter: brightness(1.07);
        transform: translateY(-1px);
      }
      .gear-btn:active {
        transform: translateY(0.3cqw);
        box-shadow: 0 0.15cqw 0 #a07650;
      }

      /* Tên món: có nền mờ để dễ đọc trên mọi ảnh nền */
      .name {
        padding: 0.15cqw 1cqw;
        background: rgba(60, 32, 24, 0.6);
        border-radius: 1cqw;
        line-height: 1.25;
        white-space: nowrap;
      }
      .ingredient {
        outline: none;
      }
      .ingredient:active {
        transform: translateY(0.3cqw) scale(0.97);
      }
      .ingredient .food-image,
      .ingredient .food-fallback {
        filter: drop-shadow(0 0.3cqw 0.3cqw rgba(40, 20, 15, 0.45));
        transition: transform 0.15s;
      }
      .ingredient:hover .food-image,
      .ingredient:hover .food-fallback {
        transform: scale(1.08);
      }
      .ingredient.selected {
        background: rgba(255, 209, 125, 0.3);
        box-shadow:
          0 0 0 0.35cqw #ffd17d,
          0 0 2.2cqw rgba(255, 209, 125, 0.85);
        animation: pop 0.25s;
      }
      .ingredient.selected .name {
        background: #ffd17d;
        color: #59352a;
        text-shadow: none;
      }
      .ingredient.selected:after {
        content: "✓";
        position: absolute;
        top: -0.6cqw;
        right: 0.2cqw;
        width: 2.6cqw;
        height: 2.6cqw;
        line-height: 2.4cqw;
        text-align: center;
        font-size: 1.8cqw;
        font-weight: 900;
        color: #59352a;
        background: #ffd17d;
        border: 2px solid #704538;
        border-radius: 50%;
      }
      .ingredient {
        position: relative;
      }
      @keyframes pop {
        0% {
          transform: scale(0.92);
        }
        60% {
          transform: scale(1.06);
        }
        100% {
          transform: translateY(-2px);
        }
      }

      /* Nút phục vụ: đỏ nổi bật như nút Play */
      .serve {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6cqw;
        color: #fff;
        background: linear-gradient(#ee5560, #cf2f3c);
        border: 3px solid #fff3e6;
        outline: 3px solid #a9242f;
        border-radius: 999px;
        box-shadow: 0 0.8cqw 0 #8c1d27;
        text-shadow: 0 2px 0 rgba(120, 20, 30, 0.6);
        letter-spacing: 0.5px;
        transition:
          filter 0.12s,
          box-shadow 0.12s;
      }
      .serve:before {
        content: "🍲";
        font-size: 1.15em;
      }
      .serve:hover:not(:disabled) {
        filter: brightness(1.07);
      }
      .serve:active:not(:disabled) {
        transform: translate(-50%, calc(-50% + 0.5cqw));
        box-shadow: 0 0.2cqw 0 #8c1d27;
      }
      .serve:disabled {
        opacity: 0.5;
        filter: grayscale(0.5);
        cursor: not-allowed;
      }

      /* ===== NÚT LÀM LẠI (bên trái pot, trên mặt quầy) ===== */
      .redo {
        left: 17.5%;
        top: 79.2%;
        transform: translate(-50%, -50%);
        width: 22cqw;
        min-height: 6cqw;
        padding: 0.8cqw 1cqw;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6cqw;
        color: #59352a;
        background: linear-gradient(#ffe29a, #ffc24d);
        border: 3px solid #fff3e6;
        outline: 3px solid #b07a22;
        border-radius: 999px;
        box-shadow: 0 0.7cqw 0 #8a5d17;
        font-size: max(11px, 2cqw);
        font-weight: 900;
        z-index: 5;
      }
      .redo:before {
        content: "↺";
        font-size: 1.2em;
      }
      .redo:hover {
        filter: brightness(1.07);
      }
      .redo:active {
        transform: translate(-50%, calc(-50% + 0.5cqw));
        box-shadow: 0 0.15cqw 0 #8a5d17;
      }
      /* khi phục vụ sai: nút nhấp nháy nhắc bấm làm lại */
      .redo.hot {
        animation: redoPulse 0.7s ease-in-out infinite;
      }
      @keyframes redoPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
        }
      }

      /* Thông báo: gọn, tự ẩn khi trống */
      .message {
        width: auto;
        min-width: 30%;
        max-width: 84%;
        border-radius: 999px;
        padding: 0.8cqw 2.4cqw;
        box-shadow: 0 0.3cqw 0 rgba(30, 15, 10, 0.35);
      }
      .message:empty {
        display: none;
      }

      /* ===== THANH KIÊN NHẪN CỦA KHÁCH ===== */
      .timebar {
        height: 2.6cqw;
        background: #c9b49c;
        border: 2px solid #70483c;
        border-radius: 1.3cqw;
        overflow: hidden;
      }
      .timefill {
        height: 100%;
        width: 100%;
        background: hsl(120 80% 45%);
      }
      .customer .timebar {
        position: absolute;
        left: 0;
        right: 0;
        top: -3cqw;
        height: 1.9cqw;
        border-radius: 1cqw;
        box-shadow: 0 2px 0 rgba(40, 20, 15, 0.35);
      }
      .customer {
        transition:
          transform 0.8s ease-out,
          opacity 0.8s;
      }
      .customer.walking .head,
      .customer.walking .body {
        animation: bob 0.3s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-0.9cqw);
        }
      }
      .bubble {
        opacity: 0;
        transform: scale(0.5);
        transform-origin: left center;
        transition:
          opacity 0.3s,
          transform 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
        pointer-events: none;
      }
      .bubble.show {
        opacity: 1;
        transform: scale(1);
      }
      .customer.angry {
        animation: shake 0.15s 4;
      }
      .customer.angry .head {
        background: #f08a7a;
      }
      .customer.angry .head span {
        border-bottom: 0;
        border-top: max(2px, 0.3cqw) solid #6d3d39;
        bottom: 1.2cqw;
      }
      .customer.leaving {
        transform: translateX(-35cqw);
        opacity: 0;
        transition:
          transform 0.7s ease-in,
          opacity 0.7s;
      } /* đổi dấu - thành + nếu muốn khách đi sang phải */
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-0.8cqw);
        }
        75% {
          transform: translateX(0.8cqw);
        }
      }

      /* ===== MÀN HÌNH BẮT ĐẦU ===== */
      .start-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #2b211f url("img/title-bg.jpg") center / cover no-repeat;
        transition: opacity 0.4s;
      }
      .start-screen.hide {
        opacity: 0;
        pointer-events: none;
      }
      .menu {
        position: absolute;
        left: 7%;
        top: 5%;
        width: min(36vw, 520px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(8px, 1.6vh, 18px);
      }
      .logo {
        width: 100%;
        text-align: center;
        margin-bottom: clamp(6px, 2vh, 24px);
      }
      .logo-main {
        font-size: clamp(44px, 8vw, 120px);
        font-weight: 900;
        line-height: 1.05;
        color: #fff6e8;
        -webkit-text-stroke: clamp(3px, 0.5vw, 8px) #9b1f2a;
        paint-order: stroke fill;
        text-shadow:
          0 0.5vw 0 #7a1620,
          0 1vw 1.2vw rgba(60, 10, 10, 0.45);
      }
      .logo-sub {
        display: inline-block;
        margin-top: 1vh;
        padding: 1vh 2vw;
        font-size: clamp(11px, 1.5vw, 22px);
        font-weight: 800;
        line-height: 1.4;
        color: #5a3a2e;
        background: #f3e0bf;
        border: 3px solid #b98a62;
        border-radius: 12px;
        box-shadow: 0 4px 0 rgba(90, 50, 30, 0.35);
      }
      .logo-sub span {
        color: #d9363e;
      }
      .btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6em;
        font-weight: 900;
        border-radius: 999px;
        transition:
          transform 0.12s,
          filter 0.12s;
      }
      .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.06);
      }
      .btn:active {
        transform: translateY(3px);
      }
      .btn-play {
        padding: clamp(12px, 2.4vh, 26px) 1em;
        font-size: clamp(20px, 2.6vw, 40px);
        color: #fff;
        background: linear-gradient(#ee5560, #cf2f3c);
        border: 4px solid #fff3e6;
        outline: 4px solid #a9242f;
        box-shadow: 0 0.7vh 0 #8c1d27;
        text-shadow: 0 2px 0 rgba(120, 20, 30, 0.6);
      }
      .tri {
        width: 0;
        height: 0;
        border-left: 0.9em solid #fff;
        border-top: 0.55em solid transparent;
        border-bottom: 0.55em solid transparent;
      }
      .btn-sub {
        width: 84%;
        padding: clamp(9px, 1.8vh, 20px) 1em;
        font-size: clamp(16px, 1.9vw, 30px);
        color: #5a3a2e;
        background: linear-gradient(#fbeed6, #efd7b0);
        border: 3px solid #fff6e6;
        outline: 3px solid #b98a62;
        box-shadow: 0 0.5vh 0 #a07650;
      }
      .top-icons {
        position: absolute;
        top: 2vh;
        right: 2vw;
        display: flex;
        gap: 1vw;
      }
      .icon-btn {
        width: clamp(38px, 4.6vw, 64px);
        height: clamp(38px, 4.6vw, 64px);
        font-size: clamp(18px, 2.2vw, 30px);
        color: #5a3a2e;
        background: #f6e3c3;
        border: 3px solid #b98a62;
        border-radius: 50%;
        box-shadow: 0 3px 0 #a07650;
      }
      @media (max-aspect-ratio: 1/1) {
        .menu {
          left: 50%;
          top: auto;
          bottom: 6%;
          transform: translateX(-50%);
          width: min(82vw, 460px);
        }
        .logo-main {
          font-size: clamp(48px, 17vw, 110px);
        }
        .logo-sub {
          font-size: clamp(12px, 3.4vw, 20px);
          padding: 1vh 5vw;
        }
        .btn-play {
          font-size: clamp(22px, 6vw, 38px);
        }
        .btn-sub {
          font-size: clamp(16px, 4.4vw, 28px);
        }
        .icon-btn {
          width: 44px;
          height: 44px;
          font-size: 20px;
        }
      }

      /* ===== BẢNG CÀI ĐẶT ===== */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30, 18, 14, 0.6);
        transition: opacity 0.25s;
      }
      .modal.hide {
        opacity: 0;
        pointer-events: none;
      }
      .panel {
        width: min(88vw, 460px);
        max-height: 88vh;
        overflow: auto;
        padding: clamp(16px, 3vh, 30px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(8px, 1.6vh, 14px);
        background: #f6e3c3;
        border: 4px solid #b98a62;
        border-radius: 24px;
        box-shadow:
          0 8px 0 #a07650,
          0 0 0 5px #fff6e6 inset;
        color: #5a3a2e;
      }
      .panel h2 {
        margin: 0;
        font-size: clamp(22px, 3vw, 34px);
        color: #9b1f2a;
      }
      .langs {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      .lang-btn {
        flex: 1;
        padding: 10px 4px;
        font-weight: 800;
        color: #5a3a2e;
        background: #fbeed6;
        border: 3px solid #b98a62;
        border-radius: 14px;
      }
      .lang-btn.active {
        background: #ee5560;
        color: #fff;
        border-color: #a9242f;
      }
      .panel .btn-sub {
        width: 100%;
      }
      .btn-danger {
        color: #9b1f2a;
      }
      .btn-close {
        padding: 10px 2em;
        font-size: clamp(15px, 1.6vw, 22px);
        color: #fff;
        background: #a07650;
        border: 0;
        border-radius: 999px;
        width: auto;
      }
      .rules-text {
        width: 100%;
        font-size: clamp(14px, 1.5vw, 18px);
        line-height: 1.6;
        text-align: left;
      }
      .rules-text ol {
        margin: 0;
        padding-left: 1.3em;
      }
      .two-btns {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      .two-btns .btn {
        flex: 1;
        width: auto;
      }
      .two-btns .btn-play {
        font-size: clamp(16px, 2vw, 24px);
        padding: 12px 0.5em;
      }

      /* ===== KHOẢNG CÁCH GIỮA CÁC NÚT (viền ngoài không dính nhau) ===== */
      .menu {
        gap: clamp(14px, 2.4vh, 26px);
      }
      .panel {
        gap: clamp(14px, 2.2vh, 20px);
      }

      /* ===== NÚT TRONG BẢNG: nhỏ gọn, không xuống dòng ===== */
      .panel {
        width: min(86vw, 400px);
      }
      .panel .btn {
        width: 100%;
        white-space: nowrap;
      }
      .panel .btn-play {
        font-size: clamp(16px, 1.6vw, 22px);
        padding: clamp(10px, 1.5vh, 15px) 1em;
        border-width: 3px;
        outline-width: 3px;
        box-shadow: 0 5px 0 #8c1d27;
      }
      .panel .btn-sub {
        font-size: clamp(14px, 1.4vw, 19px);
        padding: clamp(9px, 1.3vh, 13px) 1em;
      }
      .panel .btn-close {
        width: auto;
      }
      .panel .two-btns .btn {
        width: auto;
      }
      #dayTxt {
        text-align: center;
      }

      /* =====================================================================
         ===== DAILY MARKET (màn hình đi chợ) — phần thêm mới ================
         Toàn bộ nằm trong .market nên không ảnh hưởng các màn hình cũ.
         ===================================================================== */
      [hidden] {
        display: none !important;
      }

      /* Nút cài đặt trong game dùng ảnh bánh răng trắng -> nền tối để nổi bật */
      .gear-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(#8a5a4d, #6a4137);
        border-color: #a36f60;
        box-shadow: 0 0.5cqw 0 #4a2c25;
      }
      .gear-btn:active {
        box-shadow: 0 0.15cqw 0 #4a2c25;
      }
      .gear-icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: linear-gradient(#8a5a4d, #6a4137);
        border-color: #a36f60;
        box-shadow: 0 3px 0 #4a2c25;
      }
      .gear-icon-btn img {
        width: 70%;
        height: 70%;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }
      .gear-ico {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.5em;
        height: 1.5em;
        border-radius: 50%;
        background: linear-gradient(#8a5a4d, #6a4137);
      }
      .gear-ico img {
        width: 78%;
        height: 78%;
        object-fit: contain;
        display: block;
      }
      .gear-btn img {
        width: 70%;
        height: 70%;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }

      /* Quầy nguyên liệu trong game: huy hiệu số lượng trong kho */
      .ingredient .stock {
        position: absolute;
        top: -0.4cqw;
        left: 0.4cqw;
        z-index: 2;
        padding: 0.1cqw 0.9cqw;
        font-size: max(8px, 1.5cqw);
        font-weight: 900;
        line-height: 1.4;
        color: #ffd17d;
        background: rgba(60, 32, 24, 0.85);
        border: 2px solid #b98a62;
        border-radius: 999px;
        pointer-events: none;
      }
      .ingredient.soldout {
        opacity: 0.45;
        filter: grayscale(0.8);
      }
      .ingredient.soldout .stock {
        color: #fff;
        background: #a9242f;
        border-color: #fff3e6;
      }

      .market {
        position: fixed;
        inset: 0;
        z-index: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2b211f;
      }
      .market.hide {
        display: none;
      }
      .mgame {
        width: min(100%, 920px, calc(100dvh * 768 / 1376));
        aspect-ratio: 768 / 1376;
        position: relative;
        overflow: hidden;
        container-type: inline-size;
        background: #d9a681 url("img/market_bg.jpg") center / 100% 100%
          no-repeat;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .mgame > *,
      #mSlots > * {
        position: absolute;
      }
      #mSlots {
        inset: 0;
        pointer-events: none;
      }
      #mSlots > * {
        pointer-events: auto;
      }

      .m-title {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 5.4cqw;
        font-weight: 900;
        letter-spacing: 0.35cqw;
        color: #8a2f1c;
        text-shadow: 0 0.35cqw 0 rgba(255, 246, 232, 0.9);
        pointer-events: none;
        white-space: nowrap;
      }
      .m-money {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: max(11px, 3cqw);
        font-weight: 900;
        color: #ffe9a8;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        white-space: nowrap;
      }
      .m-roundbtn {
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 1.6cqw;
      }
      .m-roundbtn:active {
        background: rgba(255, 209, 125, 0.25);
      }
      .m-back {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4.2cqw;
        font-weight: 900;
        color: #5a3a2e;
        background: linear-gradient(#fbeed6, #efd7b0);
        border: 3px solid #b98a62;
        border-radius: 50%;
        box-shadow: 0 0.5cqw 0 #a07650;
      }
      .m-back {
        padding: 0;
      }
      .m-back img {
        width: 80%;
        height: 80%;
        object-fit: contain;
        display: block;
        mix-blend-mode: multiply; /* nếu ảnh có nền trắng thì vẫn hòa vào nền nút */
        pointer-events: none;
      }
      .m-back:active {
        transform: translateY(0.3cqw);
        box-shadow: 0 0.15cqw 0 #a07650;
      }
      .m-badge {
        position: absolute;
        top: -0.8cqw;
        right: -0.8cqw;
        min-width: 3.6cqw;
        height: 3.6cqw;
        padding: 0 0.8cqw;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: max(9px, 2cqw);
        font-weight: 900;
        color: #fff;
        background: #cf2f3c;
        border: 2px solid #fff3e6;
        border-radius: 999px;
        pointer-events: none;
      }

      /* Ô hàng: bấm vào giỏ trong ảnh = +1 */
      .bhit {
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 2.2cqw;
        outline: none;
        transition:
          box-shadow 0.15s,
          background 0.15s;
      }
      .bhit,
      .bhit:focus,
      .bhit:active {
        background: transparent;
        box-shadow: none;
        outline: none;
      }
      .bstock {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: max(8px, 1.5cqw);
        font-weight: 900;
        color: #ffd17d;
        background: rgba(66, 38, 26, 0.88);
        border: 2px solid #d9a96f;
        border-radius: 999px;
        pointer-events: none !important;
        white-space: nowrap;
      }
      .ptag {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: rotate(-6deg);
        color: #5a3a2e;
        line-height: 1.05;
        pointer-events: none !important;
      }
      .ptag b {
        font-size: max(8px, 2cqw);
        font-weight: 900;
      }
      .ptag i {
        font-size: max(6px, 1.25cqw);
        font-style: normal;
        font-weight: 800;
      }
      .mcard {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4cqw;
        padding: 0.4cqw 0.8cqw;
        background: rgba(66, 38, 26, 0.92);
        border: 2px solid #d9a96f;
        border-radius: 1.5cqw;
        box-shadow: 0 0.4cqw 0 rgba(30, 15, 10, 0.4);
      }
      .mname {
        width: 100%;
        text-align: center;
        color: #fff3df;
        font-size: max(7.5px, 1.6cqw);
        font-weight: 900;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mctrl {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .qb {
        position: relative;
        width: max(18px, 3.6cqw);
        height: max(18px, 3.6cqw);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: max(12px, 2.4cqw);
        font-weight: 900;
        line-height: 1;
        color: #5a3a2e;
        background: linear-gradient(#fbeed6, #efd7b0);
        border: 2px solid #b98a62;
        border-radius: 50%;
      }
      .qb::after {
        content: "";
        position: absolute;
        inset: -6px; /* vùng bấm rộng hơn nút để dễ chạm trên điện thoại */
      }
      .qb:active {
        filter: brightness(0.92);
      }
      .qb:disabled,
      .qb.cant {
        opacity: 0.4;
      }
      .mq {
        min-width: 2.2ch;
        text-align: center;
        color: #ffd17d;
        font-size: max(10px, 2.6cqw);
        font-weight: 900;
      }
      @keyframes qtyBump {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(1);
        }
      }
      .mq.bump {
        animation: qtyBump 0.18s;
      }

      /* Thanh dưới: tổng tiền, MUA, HOÀN TẤT */
      .m-sum {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: 800;
        line-height: 1.15;
        color: #5a3a2e;
        pointer-events: none;
      }
      .m-sum .sl {
        font-size: max(11px, 2.6cqw);
      }
      .m-sum b {
        color: #9b1f2a;
        font-size: max(18px, 5.4cqw);
        font-weight: 900;
        white-space: nowrap;
      }
      .m-buy {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6cqw;
        font-size: max(12px, 3.2cqw);
        font-weight: 900;
        letter-spacing: 0.4px;
        color: #fff;
        background: linear-gradient(#ee5560, #cf2f3c);
        border: 3px solid #fff3e6;
        outline: 3px solid #a9242f;
        border-radius: 999px;
        box-shadow: 0 0.7cqw 0 #8c1d27;
        text-shadow: 0 2px 0 rgba(120, 20, 30, 0.6);
        white-space: nowrap;
      }
      .m-buy:active:not(:disabled) {
        transform: translateY(0.5cqw);
        box-shadow: 0 0.15cqw 0 #8c1d27;
      }
      .m-buy:disabled {
        opacity: 0.5;
        filter: grayscale(0.5);
        cursor: not-allowed;
      }
      .m-checkout {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        font-size: max(13px, 4.2cqw);
        font-weight: 900;
        letter-spacing: 0.5px;
        color: #fff;
        background: transparent;
        border: 0;
        border-radius: 2cqw;
        text-shadow:
          0 0.3cqw 0 #a65b0c,
          0 0 1cqw rgba(120, 60, 0, 0.6);
        white-space: nowrap;
      }
      .m-checkout:active {
        background: rgba(255, 255, 255, 0.18);
      }
      .m-toast {
        left: 50%;
        top: 84.2%;
        transform: translateX(-50%);
        max-width: 90%;
        padding: 1cqw 3cqw;
        text-align: center;
        font-size: max(11px, 2.2cqw);
        font-weight: 800;
        color: #fff;
        background: rgba(66, 38, 26, 0.92);
        border: 2px solid #d9a96f;
        border-radius: 999px;
        box-shadow: 0 0.4cqw 0 rgba(30, 15, 10, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 5;
      }
      .m-toast.show {
        opacity: 1;
      }

      /* Bảng giỏ hàng / tổng kết */
      .cart-list {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cart-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 800;
      }
      .cart-row .cn {
        flex: 1;
        min-width: 0;
      }
      .cart-row .cs {
        color: #9b1f2a;
        white-space: nowrap;
      }
      .thumb {
        width: 36px;
        height: 36px;
        flex: none;
        object-fit: contain;
        background: #fbeed6;
        border-radius: 8px;
        border: 2px solid #d8b58d;
      }
      .cart-sec {
        width: 100%;
        margin: 0;
        font-size: 13px;
        font-weight: 900;
        color: #9b1f2a;
        border-bottom: 2px solid #d8b58d;
        padding-bottom: 4px;
      }
      .cart-total {
        width: 100%;
        font-size: 15px;

      };
      let lang = localStorage.getItem("hotpot_lang") || "vi";
      const $ = (id) => document.getElementById(id);
      const T = () => I18N[lang];
      const LOCALE = { vi: "vi-VN", ja: "ja-JP", en: "en-US" };
      const fmt = (v) => Number(v).toLocaleString(LOCALE[lang] || "en-US");

      /* ===== TRẠNG THÁI & LƯU DỮ LIỆU ===== */
      const KEY = "hotpot_save";
      /* Dữ liệu game mới: tiền ban đầu CHỈ được cấp ở đây (khi tạo mới / bắt đầu lại). */
      const newSave = () => ({
        day: 1,
        money: STARTING_MONEY,
        inventory: {}, // { itemId: số lượng trong kho }
        introSeen: false, // đã xem hướng dẫn đi chợ lần đầu chưa
        history: [], // báo cáo từng ngày: { day, revenue, cost, penalty, profit, served }
      });
      function loadSave() {
        let raw = null;
        try {
          raw = JSON.parse(localStorage.getItem(KEY) || "null");
        } catch (e) {
          raw = null;
        }
        if (!raw || typeof raw !== "object") return newSave();
        if (!raw.inventory || typeof raw.inventory !== "object") {
          // Bản lưu cũ (trước khi có chợ): giữ nguyên ngày/tiền, chỉ tạo kho trống.
          // Nếu tiền còn quá ít thì nâng lên mức ban đầu 1 lần để không bị kẹt không mua được gì.
          raw.inventory = {};
          raw.money = Math.max(+raw.money || 0, STARTING_MONEY);
          raw.introSeen = false;
        }
        raw.day = Math.max(1, Math.floor(+raw.day) || 1);
        raw.money = Math.max(0, Math.floor(+raw.money) || 0);
        for (const k of Object.keys(raw.inventory)) {
          raw.inventory[k] = Math.max(0, Math.floor(+raw.inventory[k]) || 0);
        }
        raw.introSeen = !!raw.introSeen;
        raw.updatedAt = +raw.updatedAt || 0;
        raw.history = (Array.isArray(raw.history) ? raw.history : [])
          .map((r) => ({
            day: Math.floor(+r.day) || 0,
            revenue: Math.floor(+r.revenue) || 0,
            cost: Math.floor(+r.cost) || 0,
            penalty: Math.floor(+r.penalty) || 0,
            profit: Math.floor(+r.profit) || 0,
            served: Math.floor(+r.served) || 0,
          }))
          .filter((r) => r.day > 0); // MỚI: thời điểm lưu gần nhất (để so với cloud)
        return raw;
      }
      let S = loadSave();
      let dayRevenue = 0, // doanh thu bán lẩu trong ngày
        dayPenalty = 0; // tiền phạt khách bỏ về trong ngày
      let dayMarketSpend = 0; // tiền đã chi lúc đi chợ buổi sáng của ngày
      let n = 0,
        good = 0,
        order = null,
        selB = null,
        selF = new Set(),
        playing = false,
        muted = false;
      // MỚI: localOnly = true thì chỉ ghi localStorage, không đổi dấu thời gian, không đẩy lên cloud
      const save = (localOnly) => {
        if (!localOnly) {
          S.updatedAt = Date.now();
          if (window.cloudSave) cloudSave();
        }
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {
          console.error(e);
        }

      save(true); // MỚI: lưu ngay để lần tải sau không khởi tạo lại tiền
      let timer = null,
        deadline = 0,
        dur = 15000;
      let clockTimer = null,
        dayStart = 0,
        clockR = 0,
        clockRunning = false,
        ready = false,
        dayToken = 0;

        pauseStart = 0,

      let dayItems = []; // chỉ số trong ITEMS đang bày trên quầy trong ngày
      // setTimeout nhưng tự chờ khi đang tạm dừng
      function setReady(v) {
        ready = v;
        $("serveBtn").disabled = !v;
      }
      const later = (fn, ms) =>
        setTimeout(function w() {
          paused ? setTimeout(w, 100) : fn();
        }, ms);
      const cust = () => document.querySelector(".customer"),
        bub = () => document.querySelector(".bubble");

      /* ===== ẢNH NGUYÊN LIỆU: PNG có sẵn, thiếu file thì cắt từ ảnh chợ ===== */
      const MW = 768,
        MH = 1376;
      const RX = [
        [166, 384, 602],
        [164, 385, 604],
        [160, 386, 610],
        [154, 383, 616],
        [148, 385, 620],
      ]; // tâm bảng gỗ từng ô (cột) theo từng hàng trên ảnh chợ
      const RY = [455, 618, 778, 942, 1105]; // tâm bảng gỗ theo từng hàng
      const slotOf = (i) => ({
        x: RX[Math.floor(i / 3)][i % 3],
        y: RY[Math.floor(i / 3)],
      });
      function cropStyle(it) {
        const s = slotOf(ITEMS.indexOf(it)),
          size = 150;
        const x0 = Math.min(MW - size, Math.max(0, s.x - size / 2));
        const y0 = Math.min(MH - size, Math.max(0, s.y - 74 - size / 2));
        return (
          `background:url(img/market_bg.jpg) no-repeat;` +
          `background-size:${(MW / size) * 100}% auto;` +
          `background-position:${(x0 / (MW - size)) * 100}% ${(y0 / (MH - size)) * 100}%;` +
          `aspect-ratio:1/1;`
        );
      }
      function cropFallback(img) {
        const it = ITEMS.find((x) => x.id === img.dataset.id);
        if (!it || !img.parentNode) return;
        const d = document.createElement("div");
        d.className = img.className + " crop";
        d.style.cssText = cropStyle(it);
        img.replaceWith(d);
      }
      function armImg(img) {
        if (img.dataset.id === undefined || img.dataset.id === "") return;
        img.addEventListener("error", () => cropFallback(img));
        if (img.complete && img.naturalWidth === 0 && img.getAttribute("src"))
          cropFallback(img);
      }

      /* ===== DỰNG KHAY ===== */
      function card(attr, i, o) {
        const stock = attr === "f" ? '<span class="stock"></span>' : "";
        const idAttr = attr === "f" ? ` data-id="${o.id}"` : "";
        const src = attr === "f" ? o.image : o.img;
        return `<button class="ingredient" data-${attr}="${i}">${stock}<img class="food-image"${idAttr} src="${src}" alt=""><span class="name"></span></button>`;
      }
      function build() {
        $("broths").innerHTML = broths.map((o, i) => card("b", i, o)).join("");
        // ảnh nước lẩu lỗi -> hiện emoji thay thế
        document.querySelectorAll("#broths .food-image").forEach((img) =>
          img.addEventListener("error", () => {
            const b = img.closest(".ingredient");
            const d = document.createElement("div");
            d.className = "food-fallback";
            d.textContent = broths[b.dataset.b].emoji;
            img.replaceWith(d);
          }),
        );
        $("broths").onclick = (e) => {
          const b = e.target.closest("[data-b]");
          if (!b) return;
          if (selB !== null) {
            // đã chọn nước lẩu rồi thì khóa, muốn đổi phải bấm "Làm lại"
            if (+b.dataset.b !== selB) $("msg").textContent = T().locked;
            return;
          }
          selB = +b.dataset.b;
          paint();
        };
        $("ingredients").onclick = (e) => {
          const b = e.target.closest("[data-f]");
          if (!b) return;
          const k = +b.dataset.f;
          if (!selF.has(k) && ITEMS[k].purchasedQuantity <= 0) {
            $("msg").textContent = T().outOfStock; // hết hàng trong kho thì không chọn được
            return;
          }
          selF.has(k) ? selF.delete(k) : selF.add(k);
          paint();
        };
      }
      /* Quầy nguyên liệu: dựng lại mỗi ngày theo kho (tối đa ACTIVE loại, theo thứ tự trong chợ) */
      function buildTrays() {
        dayItems = ITEMS.map((it, i) => i)
          .filter((i) => ITEMS[i].purchasedQuantity > 0)
          .slice(0, ACTIVE);
        $("ingredients").innerHTML = dayItems
          .map((i) => card("f", i, ITEMS[i]))
          .join("");
        $("ingredients").querySelectorAll(".food-image").forEach(armImg);
      }

      function paintStove() {
        const sp = $("stovePot");
        if (selB === null || selB === undefined) {
          sp.classList.remove("show");
          sp.dataset.bowl = "";
          return;
        }
        if (sp.dataset.bowl !== String(selB)) {
          sp.dataset.bowl = String(selB);
          sp.querySelectorAll("img, .food-fallback").forEach((e) => e.remove());
          const img = document.createElement("img");
          img.src = broths[selB].pot; // ảnh riêng cho bếp, khác ảnh nồi ở quầy
          img.alt = "";
          img.addEventListener("error", () => {
            const d = document.createElement("div");
            d.className = "food-fallback";
            d.textContent = "🍲";
            img.replaceWith(d);
          });
          sp.prepend(img);
          sp.classList.remove("show");
          sp.offsetWidth; // chạy lại animation khi đổi nước lẩu
        }
        // Hiển thị từng nguyên liệu ngay trong tô khi người chơi bấm chọn.
        const layer = $("potIngredients");
        if (layer) {
          layer.innerHTML = [...selF]
            .map((idx, n) => {
              const item = ITEMS[idx];
              if (!item) return "";
              const positions = [
                [8, 8],
                [37, 0],
                [65, 10],
                [20, 38],
                [49, 35],
                [0, 25],
                [72, 35],
                [33, 18],
                [57, 5],
                [12, 0],
              ];
              const [x, y] = positions[n % positions.length];
              return `<img src="${item.potImage || item.image}" alt="${nm(item)}" title="${nm(item)}" style="left:${x}%;top:${y}%">`;
            })
            .join("");
          layer.querySelectorAll("img").forEach((img) => {
            img.addEventListener(
              "error",
              () => {
                const item = ITEMS.find(
                  (candidate) => candidate.potImage === img.getAttribute("src"),
                );
                if (!item) {
                  img.remove();
                  return;
                }
                img.addEventListener("error", () => img.remove(), {
                  once: true,
                });
                img.removeAttribute("src");
                img.src = item.image;
              },
              { once: true },
            );
          });
        }
        sp.classList.add("show");
      }

      function paint() {
        try {
          paintStove();
        } catch (err) {
          console.error(err);
        }
        const t = T();
        document.querySelectorAll("[data-b]").forEach((b) => {
          b.classList.toggle("selected", +b.dataset.b === selB);
          b.querySelector(".name").textContent = nm(broths[b.dataset.b]);
        });
        document.querySelectorAll("[data-f]").forEach((b) => {
          const it = ITEMS[b.dataset.f];
          const st = it.purchasedQuantity;
          b.classList.toggle("selected", selF.has(+b.dataset.f));
          b.classList.toggle("soldout", st <= 0);
          b.querySelector(".name").textContent = nm(it);
          b.querySelector(".stock").textContent = st > 0 ? "×" + st : "0";
        });
        $("sDay").textContent =
          lang === "ja" ? S.day + t.day : t.day + " " + S.day;
        $("sMoney").textContent = "💰 " + (dayRevenue - dayPenalty); // tiền kiếm được trong phiên chơi (bắt đầu từ 0)
        $("sCust").textContent = clockStr();
        if (order) {
          const f = [...order.f].map((i) => nm(ingredients[i])).join(", ");
          $("orderTxt").innerHTML = `${nm(broths[order.b])}<br>${f}`;
        }
        document.querySelectorAll("[data-i]").forEach((el) => {
          const v = t[el.dataset.i];
          if (typeof v !== "string") return;
          el.hasAttribute("data-html")
            ? (el.innerHTML = v)
            : (el.textContent = v);
        });
        document
          .querySelectorAll(".lang-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.lang === lang),
          );
        document.documentElement.lang = lang;
        renderMarket();
      }

      /* ===== LUỒNG GAME ===== */
      /* ===== ĐỒNG HỒ QUÁN: 11:00 -> 22:00 ===== */
      function clockStr() {
        const m = 11 * 60 + Math.floor(clockR * 660);
        return (
          "🕐 " +
          String(Math.floor(m / 60)).padStart(2, "0") +
          ":" +
          String(m % 60).padStart(2, "0")
        );
      }
      function clockTick() {
        if (paused) return;
        clockR = Math.min(1, (Date.now() - dayStart) / (DAY_SECONDS * 1000));
        $("sCust").textContent = clockStr();
        if (clockR >= 1) closeShop();
      }
      /* reason: true = đóng sớm, "noStock" = hết nguyên liệu, còn lại = hết giờ 22:00 */
      function closeShop(reason) {
        closeKey =
          reason === "noStock"
            ? "noStock"
            : reason === true
              ? "closedEarly"
              : "closed";
        clearInterval(clockTimer);
        clockRunning = false;
        stopTimer();
        showRedo(false);
        playing = false;
        setReady(false);
        bub().classList.remove("show");
        cust().classList.add("walking", "leaving");
        $("msg").textContent = T()[closeKey]; // thông báo đóng cửa
        const tok = dayToken;
        later(() => {
          if (tok === dayToken) endDay();
        }, 1500);
      }
      function stopTimer() {
        clearInterval(timer);
        timer = null;
      }
      function startTimer(sec) {
        stopTimer();
        dur = sec * 1000;
        deadline = Date.now() + dur;
        tick();
        timer = setInterval(tick, 100);
      }
      function tick() {
        if (paused) return;
        const r = Math.max(0, (deadline - Date.now()) / dur);
        const f = $("timeFill");
        f.style.width = r * 100 + "%";
        f.style.background = `hsl(${Math.round(120 * r)} 80% 45%)`; // xanh (120) -> đỏ (0)
        if (r <= 0) leave();
      }
      function newCustomer() {
        // chỉ gọi món từ những nguyên liệu còn trong kho; hết sạch thì đóng cửa
        const pool = dayItems
          .filter((i) => ITEMS[i].purchasedQuantity > 0)
          .sort(() => Math.random() - 0.5);
        if (!pool.length) {
          closeShop("noStock");
          return;
        }
        const cnt = Math.min(2 + Math.floor(S.day / 2), 5, pool.length);
        order = {
          b: Math.floor(Math.random() * broths.length),
          f: new Set(pool.slice(0, cnt)),
        };
        selB = null;
        selF = new Set();
        setReady(false);
        showRedo(false);

        const c = cust(),
          bb = bub();

        // Random ảnh anime mỗi khi có khách mới
        const customerImg = c.querySelector("img.customer-image");
        if (customerImg) {
          customerImg.src = randomCustomerImage();
        }

        bb.classList.remove("show");
        c.classList.remove("angry", "walking");
        // đặt khách ngoài cửa (không animation) rồi cho đi vào
        c.style.transition = "none";
        c.classList.add("leaving");
        c.offsetWidth;
        c.style.transition = "";
        c.classList.remove("leaving");
        c.classList.add("walking");
        $("timeFill").style.width = "100%";
        $("timeFill").style.background = "hsl(120 80% 45%)";
        paint();
        later(() => {
          if (!clockRunning) return;
          c.classList.remove("walking");
          bb.classList.add("show"); // hiện khung order
          setReady(true);
          startTimer(Math.max(12, 8 + cnt * 4 - S.day)); // bắt đầu tính kiên nhẫn
        }, 850);
      }
      function serve() {
        if (!playing || !ready) return;
        const t = T();
        if (selB === null) {
          $("msg").textContent = t.pick;
          return;
        }
        const ok =
          selB === order.b &&
          selF.size === order.f.size &&
          [...selF].every((x) => order.f.has(x));
        if (!ok) {
          // Trả lời sai: chỉ giảm thanh kiên nhẫn, khách vẫn ở lại.
          // Mỗi lần sai bị trừ 3 giây; hết giờ vẫn xử lý như bình thường.
          if (deadline) deadline -= 3000;
          tick();
          return;
        }
        stopTimer();
        const amt = orderPrice(order.f); // nước lẩu + tổng giá các nguyên liệu
        S.money += amt;
        dayRevenue += amt;
        good++;
        // phục vụ đúng: tiêu hao 1 phần mỗi nguyên liệu trong kho
        order.f.forEach((i) => {
          ITEMS[i].purchasedQuantity = ITEMS[i].purchasedQuantity - 1;
        });
        $("msg").textContent = t.ok + amt;
        n++;
        save();
        selB = null; // bưng tô đi: tô trên mâm biến mất, bỏ chọn các món
        selF = new Set();
        paint();
        // làm xong: ẩn order, khách đi ra, rồi khách mới đi vào
        setReady(false);
        bub().classList.remove("show");
        cust().classList.add("walking", "leaving");
        later(() => {
          if (!clockRunning) return;
          newCustomer();
        }, 800);
      }
      function showRedo(v) {
        $("redoBtn").classList.toggle("hot", v);
      }
      function redo() {
        if (!playing) return;
        selB = null; // mở khóa nước lẩu
        selF = new Set();
        $("msg").textContent = "";
        showRedo(false);
        if (timer) setReady(true); // khách đang đợi thì cho phục vụ lại
        paint();
      }
      /* Hết thời gian: khách giận bỏ về */
      function leave() {
        stopTimer();
        showRedo(false);
        selB = null; // tô biến mất cùng lúc khách bỏ về
        selF = new Set();
        playing = false;
        setReady(false);
        bub().classList.remove("show");
        const t = T(),
          c = cust();
        const lost = Math.min(S.money, 50);
        S.money -= lost;
        dayPenalty += lost;
        n++;
        save();
        $("msg").textContent = t.angry + 50;
        paint();
        c.classList.add("angry");
        later(() => c.classList.add("walking", "leaving"), 650);
        later(() => {
          if (!clockRunning) return;
          playing = true;
          newCustomer();
        }, 1250);
      }
      function endDay() {
        stopTimer();
        playing = false;
        const t = T(),
          day = S.day,
          profit = dayRevenue - dayMarketSpend - dayPenalty,
          dayLabel = lang === "ja" ? day + t.day : t.day + " " + day;
        $("dayTitle").textContent = dayLabel + " " + t.dayEnd;
        const sign = (v) => (v >= 0 ? "+" : "-") + fmt(Math.abs(v));
        const row = (label, val, cls = "") =>
          `<div class="rep-row ${cls}"><span>${label}</span><b>${val} ${t.m_coin}</b></div>`;
        $("dayTxt").innerHTML =
          `<div style="text-align:center;margin-bottom:6px">${t[closeKey]}</div>` +
          `<div class="rep-row"><span>${t.res}</span><b>${good}</b></div>` +
          row(t.revenue, "+" + fmt(dayRevenue)) +
          row(t.marketCost, "-" + fmt(dayMarketSpend)) +
          row(t.penalty, "-" + fmt(dayPenalty)) +
          row(t.net, sign(profit), "rep-total" + (profit < 0 ? " neg" : "")) +
          `<div style="text-align:center;margin-top:10px">💰 ${t.m_moneyLabel}: <b>${fmt(S.money)}</b> ${t.m_coin}</div>`;
        $("nextBtn").textContent = t.next;
        // lưu báo cáo của ngày này (thay thế nếu trùng ngày)
        S.history = (S.history || []).filter((r) => r.day !== day);
        S.history.push({
          day,
          revenue: dayRevenue,
          cost: dayMarketSpend,
          penalty: dayPenalty,
          profit,
          served: good,
        });
        S.history = S.history.slice(-1000);
        S.day++; // luôn sang ngày tiếp theo, không chơi lại ngày cũ
        save();
        $("nextBtn").onclick = () => {
          closeModal("dayModal");
          openMarket(); // mỗi ngày đều đi chợ trước khi mở quán
        };
        openModal("dayModal");
        paint();
      }
      function beginDay() {
        dayToken++;
        n = 0;
        good = 0;
        dayRevenue = 0;
        dayPenalty = 0;
        playing = true;
        $("msg").textContent = "";
        buildTrays(); // bày nguyên liệu trong kho lên quầy
        clockR = 0;
        dayStart = Date.now();
        clockRunning = true;
        clearInterval(clockTimer);
        clockTimer = setInterval(clockTick, 200);
        clockTick();
        newCustomer();
      }
      /* Dừng hẳn ngày chơi đang chạy (khi bắt đầu lại / quay về chợ) */
      function abortDay() {
        dayToken++;
        clearInterval(clockTimer);
        clockRunning = false;
        stopTimer();
        playing = false;
        paused = false;
        setReady(false);
        $("gameRoot").classList.remove("paused");
        closeModal("pauseModal");
        closeModal("dayModal");
      }

      /* =====================================================================
         ===== DAILY MARKET ===================================================
         ===================================================================== */
      let marketLock = false; // chống bấm MUA liên tục
      let mReady = false;
      let mSlots = [];
      let toastTimer = null;

      const cartTotal = () =>
        ITEMS.reduce((s, it) => s + it.price * it.selectedQuantity, 0);
      const cartCount = () =>
        ITEMS.reduce((s, it) => s + it.selectedQuantity, 0);
      const stockTotal = () =>
        ITEMS.reduce((s, it) => s + it.purchasedQuantity, 0);
      const stockKinds = () =>
        ITEMS.filter((it) => it.purchasedQuantity > 0).length;
      const isMarketOpen = () => !$("market").classList.contains("hide");

      function place(el, cx, cy, w, h) {
        el.style.left = ((cx - w / 2) / MW) * 100 + "%";
        el.style.top = ((cy - h / 2) / MH) * 100 + "%";
        el.style.width = (w / MW) * 100 + "%";
        el.style.height = (h / MH) * 100 + "%";
      }
      function toast(msg) {
        const el = $("mToast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
      }

      function buildMarket() {
        // vị trí các nút cố định trên ảnh nền (toạ độ theo ảnh 768 x 1376)
        place($("mBack"), 40, 38, 52, 52);
        place($("mTitle"), 425, 157, 470, 70);
        place($("mMoney"), 132, 157, 104, 40);
        place($("mCartTop"), 697, 155, 70, 66);
        place($("mCartBottom"), 123, 1280, 163, 104);
        place($("mSum"), 330, 1277, 230, 100);
        place($("mCheckout"), 590, 1277, 271, 90);

        const root = $("mSlots");
        const mk = (cls) => {
          const e = document.createElement(cls.tag || "div");
          e.className = cls.c;
          root.appendChild(e);
          return e;
        };
        mSlots = ITEMS.map((it, i) => {
          const { x: cx, y: py } = slotOf(i);
          const hit = mk({ tag: "button", c: "bhit" });
          place(hit, cx, py - 78, 150, 112);
          hit.dataset.act = "inc";
          hit.dataset.idx = i;
          const stock = mk({ c: "bstock" });
          place(stock, cx - 50, py - 122, 58, 22);
          const tag = mk({ c: "ptag" });
          place(tag, cx - 68, py - 24, 42, 44);
          tag.innerHTML = "<b></b><i></i>";
          const cardEl = mk({ c: "mcard" });
          place(cardEl, cx, py + 11, 112, 58);
          cardEl.dataset.idx = i;
          cardEl.innerHTML =
            '<div class="mname"></div><div class="mctrl">' +
            '<button class="qb" data-act="dec" aria-label="-">−</button>' +
            '<span class="mq">0</span>' +
            '<button class="qb" data-act="inc" aria-label="+">+</button></div>';
          return {
            hit,
            stock,
            price: tag.querySelector("b"),
            coin: tag.querySelector("i"),
            name: cardEl.querySelector(".mname"),
            qty: cardEl.querySelector(".mq"),
            minus: cardEl.querySelector('[data-act="dec"]'),
            plus: cardEl.querySelector('[data-act="inc"]'),
          };
        });

        // một handler duy nhất cho mọi nguyên liệu (không code riêng từng món)
        root.addEventListener("click", (e) => {
          const b = e.target.closest("[data-act]");
          if (!b) return;
          const holder = b.closest("[data-idx]");
          if (!holder) return;
          changeQty(+holder.dataset.idx, b.dataset.act === "inc" ? 1 : -1);
        });
        $("mCheckout").onclick = checkout;
        $("mCartTop").onclick = $("mCartBottom").onclick = openCart;
        $("mBack").onclick = leaveMarket;
        $("ckGo").onclick = finishShopping;
        mReady = true;
      }

      /* (+) / (−): chỉ đổi số lượng DỰ ĐỊNH mua, chưa trừ tiền */
      function changeQty(i, d) {
        const it = ITEMS[i];
        if (!it) return;
        if (d > 0) {
          if (it.selectedQuantity >= MAX_QTY) return;

          // Giới hạn tối đa 10 LOẠI nguyên liệu được bày trong quán.
          // Nguyên liệu đã có trong kho không tính là loại mới.
          if (it.selectedQuantity === 0 && it.purchasedQuantity <= 0) {
            const kindsAfterAdd =
              stockKinds() +
              ITEMS.filter(
                (item) =>
                  item.selectedQuantity > 0 && item.purchasedQuantity <= 0,
              ).length +
              1;
            if (kindsAfterAdd > ACTIVE) {
              toast(T().m_trayLimit);
              return;
            }
          }

          if (cartTotal() + it.price > S.money) {
            toast(T().m_notEnough); // không vượt quá khả năng chi trả
            return;
          }
          it.selectedQuantity += 1;
        } else if (it.selectedQuantity > 0) {
          it.selectedQuantity -= 1; // tối thiểu 0, không bao giờ âm
        }
        renderMarket();
        const q = mSlots[i] && mSlots[i].qty;
        if (q) {
          q.classList.remove("bump");
          void q.offsetWidth;
          q.classList.add("bump");
        }
      }

      /* Thanh toán giỏ hàng khi bấm "Mở quán": trừ tiền + cộng kho trong MỘT bước đồng bộ
         (tất cả hoặc không gì cả). Giỏ về 0 ngay nên không thể trừ tiền hai lần. */
      function commitPurchase() {
        const lines = ITEMS.filter((it) => it.selectedQuantity > 0);
        dayMarketSpend = 0; // chưa chi gì cho ngày này
        if (!lines.length) return true; // không mua gì thêm, dùng kho hiện có
        const total = cartTotal();
        if (total > S.money) return false; // không đủ tiền: không trừ, không mua một phần
        S.money -= total;
        dayMarketSpend = total; // chi phí đi chợ của ngày
        lines.forEach((it) => {
          it.purchasedQuantity = it.purchasedQuantity + it.selectedQuantity;
          it.selectedQuantity = 0;
        });
        save();
        return true;
      }

      function itemRows(map, withPrice) {
        const rows = ITEMS.filter((it) => map(it) > 0).map((it) => {
          const q = map(it);
          return (
            `<div class="cart-row"><img class="thumb" data-id="${it.id}" src="${it.image}" alt="">` +
            `<span class="cn">${nm(it)} × ${q}</span>` +
            (withPrice ? `<span class="cs">${fmt(q * it.price)}</span>` : "") +
            `</div>`
          );
        });
        return rows.join("");
      }
      function armThumbs(root) {
        root.querySelectorAll(".thumb").forEach(armImg);
      }

      function openCart() {
        const t = T();
        const total = cartTotal();
        let html = `<h4 class="cart-sec">${t.m_cart}</h4>`;
        html +=
          cartCount() > 0
            ? itemRows((it) => it.selectedQuantity, true)
            : `<div class="cart-empty">${t.m_cartEmpty}</div>`;
        html += `<div class="cart-total">${t.m_total}: ${fmt(total)} ${t.m_coin}<br>${t.m_left}: ${fmt(S.money - total)} ${t.m_coin}</div>`;
        if (stockTotal() > 0) {
          html +=
            `<h4 class="cart-sec">${t.m_stock}</h4>` +
            itemRows((it) => it.purchasedQuantity, false);
        }
        $("cartList").innerHTML = html;
        armThumbs($("cartList"));
        openModal("cartModal");
      }

      /* HOÀN TẤT: hiện tổng kết giỏ hàng; tiền chỉ bị trừ khi xác nhận "Mở quán" */
      function checkout() {
        const t = T();
        if (cartCount() <= 0 && stockTotal() <= 0) {
          toast(t.m_needBuy); // chưa chọn gì và kho trống
          return;
        }
        const total = cartTotal();
        let html = "";
        if (cartCount() > 0) {
          html +=
            `<h4 class="cart-sec">${t.m_cart}</h4>` +
            itemRows((it) => it.selectedQuantity, true);
          html += `<div class="cart-total">${t.m_total}: ${fmt(total)} ${t.m_coin}<br>${t.m_left}: ${fmt(S.money - total)} ${t.m_coin}</div>`;
        } else {
          html += `<div class="cart-empty">${t.m_none}<br>💰 ${fmt(S.money)} ${t.m_coin}</div>`;
        }
        if (stockTotal() > 0) {
          html +=
            `<h4 class="cart-sec">${t.m_stock}</h4>` +
            itemRows((it) => it.purchasedQuantity, false);
        }
        if (
          stockKinds() +
            ITEMS.filter(
              (it) => it.selectedQuantity > 0 && it.purchasedQuantity <= 0,
            ).length >
          ACTIVE
        )
          html += `<div class="cart-empty">${t.m_trayLimit}</div>`;
        $("ckText").innerHTML = html;
        armThumbs($("ckText"));
        openModal("ckModal");
      }
      function finishShopping() {
        if (marketLock) return;
        marketLock = true;
        try {
          if (!commitPurchase()) {
            closeModal("ckModal");
            toast(T().m_notEnough);
            return;
          }
          closeModal("ckModal");
          S.introSeen = true;
          save();
          $("market").classList.add("hide");
          beginDay();
        } finally {
          marketLock = false;
        }
      }

      function renderMarket() {
        if (!mReady) return;
        const t = T();
        const total = cartTotal(),
          cnt = cartCount();
        $("mMoney").textContent = fmt(S.money);
        ITEMS.forEach((it, i) => {
          const s = mSlots[i];
          s.name.textContent = nm(it);
          s.price.textContent = fmt(it.price);
          s.coin.textContent = t.m_coin;
          s.qty.textContent = it.selectedQuantity;
          s.hit.classList.toggle("has", it.selectedQuantity > 0);
          s.hit.setAttribute("aria-label", nm(it) + " +1");
          const own = it.purchasedQuantity;
          s.stock.hidden = own <= 0;
          s.stock.textContent = "📦 " + own;
          s.minus.disabled = it.selectedQuantity <= 0;
          s.plus.classList.toggle(
            "cant",
            it.selectedQuantity >= MAX_QTY || total + it.price > S.money,
          );
        });
        [$("mBadgeTop"), $("mBadgeBottom")].forEach((b) => {
          b.hidden = cnt <= 0;
          b.textContent = cnt;
        });
        $("mSum").innerHTML =
          `<span class="sl">${t.m_total}</span><b>${fmt(total)} ${t.m_coin}</b>`;
        $("mCheckout").textContent = t.m_checkout;
        $("mBack").setAttribute("aria-label", t.m_back);
      }

      function openMarket() {
        abortDay();
        dayRevenue = 0; // xóa số liệu phiên cũ (thanh trên không còn hiện số của ngày trước)
        dayPenalty = 0;
        dayMarketSpend = 0;
        clockR = 0;
        order = null;
        selB = null;
        selF = new Set();
        $("msg").textContent = "";
        paint();
        marketLock = false;
        ITEMS.forEach((it) => (it.selectedQuantity = 0));
        $("market").classList.remove("hide");
        renderMarket();
        if (!S.introSeen) {
          // hướng dẫn hiện đúng 1 lần cho dữ liệu game mới
          S.introSeen = true;
          save();
          $("infoTitle").textContent = T().m_introTitle;
          $("infoText").textContent = T().m_intro.replace("{m}", fmt(S.money));
          openModal("infoModal");
        }
      }
      function leaveMarket() {
        ITEMS.forEach((it) => (it.selectedQuantity = 0));
        $("market").classList.add("hide");
        $("startScreen").classList.remove("hide");
      }

      /* ===== MÀN HÌNH BẮT ĐẦU / BẢNG ===== */
      const openModal = (id) => $(id).classList.remove("hide");
      const closeModal = (id) => $(id).classList.add("hide");
      /* ===== DOANH THU THEO THÁNG (1 tháng = MONTH_DAYS ngày chơi) ===== */
      const MONTH_DAYS = 30;
      let revMonth = 1;
      const monthOf = (d) => Math.floor((d - 1) / MONTH_DAYS) + 1;
      function renderRevenue() {
        const t = T();
        const cur = monthOf(S.day);
        revMonth = Math.min(Math.max(1, revMonth), cur);
        const list = (S.history || [])
          .filter((r) => monthOf(r.day) === revMonth)
          .sort((a, b) => a.day - b.day);
        $("revMonth").textContent =
          lang === "ja" ? revMonth + t.m_month : t.m_month + " " + revMonth;
        $("revPrev").disabled = revMonth <= 1;
        $("revNext").disabled = revMonth >= cur;
        const sum = (k) => list.reduce((s, r) => s + r[k], 0);
        const sgn = (v) => (v >= 0 ? "+" : "-") + fmt(Math.abs(v));
        const line = (label, val, cls = "") =>
          `<div class="rep-row ${cls}"><span>${label}</span><b>${val} ${t.m_coin}</b></div>`;
        if (!list.length) {
          $("revBody").innerHTML =
            `<div class="rev-empty">${t.m_revEmpty}</div>`;
          return;
        }
        const profit = sum("profit");
        const rows = list
          .map(
            (r) =>
              `<tr><td>${r.day}</td><td>+${fmt(r.revenue)}</td><td>-${fmt(r.cost)}</td>` +
              `<td>-${fmt(r.penalty)}</td><td class="${r.profit < 0 ? "neg" : ""}">${sgn(r.profit)}</td></tr>`,
          )
          .join("");
        $("revBody").innerHTML =
          line(t.m_revTotal, "+" + fmt(sum("revenue"))) +
          line(t.marketCost, "-" + fmt(sum("cost"))) +
          line(t.penalty, "-" + fmt(sum("penalty"))) +
          line(t.net, sgn(profit), "rep-total" + (profit < 0 ? " neg" : "")) +
          `<table class="rev-table"><thead><tr><th>${t.hDay}</th><th>${t.hRev}</th><th>${t.hCost}</th><th>${t.hPen}</th><th>${t.hNet}</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
      $("introRevenue").onclick = () => {
        const hist = S.history || [];
        revMonth = hist.length ? monthOf(hist[hist.length - 1].day) : 1; // mở tháng có dữ liệu mới nhất
        renderRevenue();
        openModal("revModal");
      };
      $("revPrev").onclick = () => {
        revMonth--;
        renderRevenue();
      };
      $("revNext").onclick = () => {
        revMonth++;
        renderRevenue();
      };

      function showIntro() {
        const t = T();
        $("introDay").textContent =
          lang === "ja" ? S.day + t.day : t.day + " " + S.day;
        $("introMoney").innerHTML =
          `<small>${t.m_moneyLabel}</small><b>💰 ${fmt(S.money)} ${t.m_coin}</b>`;
        openModal("introModal");
      }
      $("introGo").onclick = () => {
        closeModal("introModal");
        openMarket(); // bấm Đi chợ mới vào chợ
      };

      function startGame() {
        $("startScreen").classList.add("hide");
        showIntro();
      }
      $("playBtn").onclick = () => {
        S = newSave(); // ván mới: cấp tiền ban đầu đúng 1 lần
        save();
        startGame();
      }; // ván mới
      $("settingsBtn").onclick = $("gearBtn").onclick = () =>
        openModal("settingsModal");
      $("rulesBtn").onclick = () => openModal("rulesModal");
      $("restartBtn").onclick = () => openModal("confirmModal");
      $("soundBtn").onclick = (e) => {
        muted = !muted;
        e.currentTarget.textContent = muted ? "🔇" : "🔊";
      };
      $("serveBtn").onclick = serve;
      $("redoBtn").onclick = redo;
      document.querySelectorAll("[data-close]").forEach(
        (b) =>
          (b.onclick = () => {
            closeModal(b.dataset.close);
            if (b.dataset.close === "settingsModal" && gearPaused) {
              gearPaused = false;
              resumeGame();
            }
          }),
      );
      document.querySelectorAll(".lang-btn").forEach(
        (b) =>
          (b.onclick = () => {
            lang = b.dataset.lang;
            localStorage.setItem("hotpot_lang", lang);
            paint();
          }),
      );

      /* ===== TẠM DỪNG ===== */
      function pauseGame(showModal = true) {
        if (!clockRunning || paused) return;
        paused = true;
        pauseStart = Date.now();
        $("gameRoot").classList.add("paused");
        if (showModal) openModal("pauseModal");
      }
      function resumeGame() {
        if (!paused) return;
        const d = Date.now() - pauseStart; // bù thời gian đã dừng cho đồng hồ + thanh kiên nhẫn
        dayStart += d;
        deadline += d;
        paused = false;
        $("gameRoot").classList.remove("paused");
        closeModal("pauseModal");
      }
      $("pauseBtn").onclick = () => pauseGame();
      // Nút cài đặt trong game: tự tạm dừng, đóng bảng thì chơi tiếp
      let gearPaused = false;
      $("gameGearBtn").onclick = () => {
        pauseGame(false);
        gearPaused = paused;
        openModal("settingsModal");
      };
      $("resumeBtn").onclick = resumeGame;
      $("closeEarlyBtn").onclick = () => {
        resumeGame();
        closeShop(true);
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") paused ? resumeGame() : pauseGame();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pauseGame();
      });

      function randomCustomerImage() {
        const number = Math.floor(Math.random() * 6) + 1;
        return `img/customers/customers_${String(number).padStart(2, "0")}.png`;
      }

      /* Bắt đầu lại từ đầu -> Ngày 1 (dữ liệu mới, tiền ban đầu, kho trống) */
      $("confirmYes").onclick = () => {
        gearPaused = false;
        resumeGame(); // nếu đang tạm dừng vì mở cài đặt trong game
        S = newSave();
        save();
        closeModal("confirmModal");
        closeModal("settingsModal");
        startGame();
      };

      build();
      buildMarket();
      paint();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
  </body>
</html>
